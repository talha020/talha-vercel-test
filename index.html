<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vercel Test</title>
<style>
  :root{--bg:#fafaf9;--ink:#18181b;--mut:#71717a;--line:#e4e4e7;--ok:#15803d}
  @media(prefers-color-scheme:dark){:root{--bg:#09090b;--ink:#fafafa;--mut:#a1a1aa;--line:#27272a;--ok:#4ade80}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
       font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;padding:24px}
  .card{max-width:420px;width:100%;text-align:center}
  .tri{font-size:38px;line-height:1;margin-bottom:18px}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
  p{color:var(--mut);margin:0 0 22px;font-size:14px;line-height:1.6}
  .row{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
  .row span:first-child{color:var(--mut)}
  .ok{color:var(--ok);font-weight:600}
</style></head><body>
<div class="card">
  <div class="tri">▲</div>
  <h1>Deploy successful</h1>
  <p>Pushed live from the terminal. If you can read this, the CLI is wired to your Vercel account.</p>
  <div class="row"><span>Account</span><span>talha020</span></div>
  <div class="row"><span>Method</span><span>git push</span></div>
  <div class="row"><span>Status</span><span class="ok">Live · auto-deployed from GitHub</span></div>
</div>
</body></html>
